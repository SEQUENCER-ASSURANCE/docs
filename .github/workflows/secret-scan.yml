name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/${checksums}"
          grep " ${tarball}\$" "${checksums}" | sha256sum --check --strict -
          echo "gitleaks v${GITLEAKS_VERSION} sha256: $(sha256sum "${tarball}" | cut -d' ' -f1)"
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version

      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
